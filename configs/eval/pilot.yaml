# Pilot evaluation config: test existing models on perceptual sensitivity task
# Usage: python scripts/eval/pilot_eval.py --config configs/eval/pilot.yaml

experiment:
  name: "pilot_v1"
  output_dir: "experiments/pilot_eval"

data:
  manifest: "data/pilot/manifest.json"
  max_image_size: null  # null = original size; set e.g. 1024 to cap long edge

models:
  iqa:
    enabled: true
    device: "cuda"      # "cpu" for local debug
    nr_models:
      # Handcrafted (natural image statistics baseline, 2012)
      - "niqe"
      - "brisque"
      # Deep NR-IQA
      - "topiq_nr"           # SOTA NR, subsumes DBCNN/HyperIQA
      - "musiq"              # Multi-scale transformer (different inductive bias)
      - "maniqa"             # ViT patch-weighted attention
      # CLIP-guided
      - "qualiclip+"         # Self-supervised CLIP IQA (2025, replaces clipiqa+)
      - "maclip"             # Magnitude-aware CLIP (AAAI 2026, feature norm as quality signal)
      - "liqe"               # CLIP + language multi-task (CVPR 2023)
      # CVPR 2025
      - "afine_nr"           # Adaptive fidelity-naturalness (CVPR 2025)
      # MLLM-based IQA
      - "qalign"             # LMM quality scoring (ICML 2024)
      - "compare2score"      # LMM pairwise comparison (NeurIPS 2024 Spotlight)
    fr_models:
      - "lpips"              # Learned perceptual distance (2018)
      - "dists"              # Structure + texture similarity (2022)
      - "topiq_fr"           # TOPIQ full-reference (NR/FR contrast)
      - "afine_fr"           # Adaptive fidelity-naturalness FR (CVPR 2025)

  # RL-enhanced MLLM IQA (standalone repos, NeurIPS 2025)
  # These use native quality scoring prompts (1-5 scale), not our 3-prompt VLM templates.
  # Results are treated as NR-IQA scores for SRCC/PLCC computation.
  mllm_iqa:
    enabled: true
    device: "cuda"
    models:
      - name: "Q-Insight"
        model_id: "ByteDance/Q-Insight"
        subfolder: "score_degradation"   # HuggingFace subfolder for scoring weights
        venue: "NeurIPS 2025 Spotlight"
      - name: "VisualQuality-R1"
        model_id: "TianheWu/VisualQuality-R1-7B"
        subfolder: null
        venue: "NeurIPS 2025 Spotlight"

  vlm:
    enabled: true
    models:
      # === Fully implemented ===
      - name: "gpt-5.4"
        provider: "openai"
        model_id: "gpt-5.4"
        api_key_env: "OPENAI_API_KEY"
        max_tokens: 1500
        temperature: 0.1
      - name: "gpt-4.1"
        provider: "openai"
        model_id: "gpt-4.1"
        api_key_env: "OPENAI_API_KEY"
        max_tokens: 1500
        temperature: 0.1
      - name: "Qwen3-VL-8B"
        provider: "local"
        model_id: "Qwen/Qwen3-VL-8B-Instruct"
        device: "cuda"
        max_tokens: 1500
      # === Placeholder (not implemented yet) ===
      - name: "gemini-2.5-flash"
        provider: "google"
        model_id: "gemini-2.5-flash"
        api_key_env: "GOOGLE_API_KEY"
        max_tokens: 1500
        temperature: 0.1
      - name: "claude-sonnet-4-5"
        provider: "anthropic"
        model_id: "claude-sonnet-4-5-20250929"
        api_key_env: "ANTHROPIC_API_KEY"
        max_tokens: 1500
        temperature: 0.1
    prompts:
      - "holistic"       # Independent quality rating per image
      - "comparative"    # Paired comparison with region awareness
      - "sensitivity"    # Sensitivity probing (core hypothesis test)
    rate_limit_delay: 2.0   # seconds between API calls
    max_retries: 3
    retry_delay: 10.0       # base delay for exponential backoff

output:
  save_json: true
  save_csv: true

logging:
  level: "INFO"
  log_file: null  # null = auto-generate in output_dir
